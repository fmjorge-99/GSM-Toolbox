<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E6FE0"/>
      <stop offset="0.55" stop-color="#1597B8"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8F0FA"/>
    </linearGradient>
  </defs>

  <!-- rounded app tile -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg)"/>

  <!-- subtle circuit / computation motif -->
  <g stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6" fill="#FFFFFF" fill-opacity="0.22">
    <path d="M70 150 H120 V210" fill="none"/>
    <circle cx="70" cy="150" r="11"/>
    <circle cx="120" cy="210" r="11"/>
    <path d="M442 150 H392 V210" fill="none"/>
    <circle cx="442" cy="150" r="11"/>
    <circle cx="392" cy="210" r="11"/>
    <path d="M70 360 H132" fill="none"/>
    <circle cx="70" cy="360" r="11"/>
    <path d="M442 360 H380" fill="none"/>
    <circle cx="442" cy="360" r="11"/>
  </g>

  <!-- DNA double helix rising above the toolbox -->
  <g stroke-linecap="round" fill="none">
    <g stroke="#FFFFFF" stroke-opacity="0.95">
      <!-- rungs -->
      <line x1="214" y1="92" x2="298" y2="92" stroke-width="9" stroke-opacity="0.55"/>
      <line x1="200" y1="128" x2="312" y2="128" stroke-width="9" stroke-opacity="0.45"/>
      <line x1="214" y1="166" x2="298" y2="166" stroke-width="9" stroke-opacity="0.55"/>
      <line x1="232" y1="204" x2="280" y2="204" stroke-width="9" stroke-opacity="0.6"/>
    </g>
    <!-- two backbone strands (mirrored S-curves) -->
    <path d="M212 70 C 318 110, 318 150, 212 196 C 150 222, 150 232, 212 236"
          stroke="#FFFFFF" stroke-width="17"/>
    <path d="M300 70 C 194 110, 194 150, 300 196 C 362 222, 362 232, 300 236"
          stroke="#CFF8EE" stroke-width="17"/>
  </g>

  <!-- toolbox -->
  <g>
    <!-- handle -->
    <path d="M214 250 v-12 a42 42 0 0 1 84 0 v12" fill="none" stroke="#FFFFFF" stroke-width="16"/>
    <!-- lid -->
    <path d="M150 252 h212 a16 16 0 0 1 16 16 v22 H134 v-22 a16 16 0 0 1 16-16 z" fill="url(#box)"/>
    <!-- body -->
    <rect x="120" y="296" width="272" height="132" rx="20" fill="url(#box)"/>
    <!-- latch / clasp -->
    <rect x="236" y="276" width="40" height="40" rx="8" fill="#1597B8"/>
    <!-- center band with a node (computation) -->
    <rect x="120" y="338" width="272" height="20" fill="#1E6FE0" fill-opacity="0.18"/>
    <circle cx="256" cy="348" r="16" fill="#10B981"/>
    <circle cx="256" cy="348" r="6" fill="#FFFFFF"/>
  </g>
</svg>
