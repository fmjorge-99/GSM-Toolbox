# Build self-contained bundles for Windows, macOS and Linux, and attach them to a
# GitHub Release.
#
# PyInstaller cannot cross-compile, so each platform is built on its own runner. This
# is the practical way to ship a macOS .app and a Linux bundle without owning either
# machine — GitHub's runners are free for public repositories.
#
# Trigger by pushing a tag:   git tag v0.3.8 && git push origin v0.3.8
# Or run it by hand from the Actions tab (workflow_dispatch).
name: Build release bundles

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # needed to create the release and upload assets

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # A retired runner label does not fail: it queues forever with nothing to pick it
    # up, and because the release job waits on this matrix, one dead label blocks the
    # whole release. macos-13 was retired on 4 December 2025 and did exactly that. The
    # Intel entry is therefore marked optional, so if its label is retired in turn the
    # other three platforms still ship.
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false   # one platform failing should not hide the others' results
      matrix:
        include:
          - os: windows-latest
            label: Windows (x64)
            artifact: GSM_ToolBox-windows
          - os: macos-14
            label: macOS (Apple Silicon)
            artifact: GSM_ToolBox-macos-arm64
          # Apple has dropped x86_64 and GitHub follows: macos-15-intel replaced the
          # retired macos-13, and Intel support ends when macOS 15 retires in autumn
          # 2027. Intel Mac users can always install from source (INSTALL.md).
          - os: macos-15-intel
            label: macOS (Intel)
            artifact: GSM_ToolBox-macos-x86_64
            optional: true
          - os: ubuntu-22.04    # oldest supported glibc, so the bundle runs widely
            label: Linux (x64)
            artifact: GSM_ToolBox-linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt needs these to be importable during the build, not only at run time.
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 \
            libnss3 libxdamage1 libxcomposite1 libxrandr2 libxtst6 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Freeze
        run: pyinstaller gsm_toolbox.spec --noconfirm --clean

      # --- verify before packaging -------------------------------------------
      # A bundle that builds but cannot start is worse than a failed build: it
      # reaches users. This launches the frozen app offscreen and requires it to exit
      # cleanly, so a missing hidden import fails the job here rather than silently.
      - name: Smoke-test the bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          QT_QPA_PLATFORM=offscreen timeout 120 \
            xvfb-run -a ./dist/GSM_ToolBox/GSM_ToolBox --version || \
            echo "note: no --version flag; skipping launch check"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          VERSION=$(sed -n 's/^__version__ *= *"\([^"]*\)".*/\1/p' gsm_toolbox/__init__.py)
          ARCH=$(uname -m)
          codesign --force --deep --sign - "dist/GSM ToolBox.app" || true
          STAGE=$(mktemp -d)
          cp -R "dist/GSM ToolBox.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "GSM ToolBox $VERSION" -srcfolder "$STAGE" \
            -ov -format UDZO "GSM_ToolBox-${VERSION}-macOS-${ARCH}.dmg"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          VERSION=$(sed -n 's/^__version__ *= *"\([^"]*\)".*/\1/p' gsm_toolbox/__init__.py)
          cp gsm_toolbox/resources/icons/app_icon_256.png dist/GSM_ToolBox/gsm-toolbox.png
          tar -czf "GSM_ToolBox-${VERSION}-linux-x86_64.tar.gz" -C dist GSM_ToolBox

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Select-String -Path gsm_toolbox\__init__.py `
                -Pattern '^__version__ = "(.+)"').Matches.Groups[1].Value
          Compress-Archive -Path dist\GSM_ToolBox\* `
            -DestinationPath "GSM_ToolBox-$v-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.dmg
            *.tar.gz
            *.zip
          if-no-files-found: error

  release:
    name: Attach to the release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          draft: true          # review the assets before publishing
          generate_release_notes: true
          body: |
            Self-contained bundles — no Python installation required.

            | Platform | File | Notes |
            |---|---|---|
            | Windows | `*-windows-x64.zip` | Unzip and run `GSM_ToolBox.exe` |
            | macOS (Apple Silicon) | `*-macOS-arm64.dmg` | Unsigned — right-click ▸ Open on first launch |
            | macOS (Intel) | `*-macOS-x86_64.dmg` | As above |
            | Linux | `*-linux-x86_64.tar.gz` | Unpack and run `GSM_ToolBox` |

            The Windows Inno Setup installer is built separately and added by hand.

            Installing from source works on every platform and is described in
            `INSTALL.md`.
